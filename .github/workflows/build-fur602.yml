name: Build ImmortalWrt 5.4 + mtwifi for HONOR FUR-602

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: '源码分支（hanwckf/immortalwrt-mt798x）'
        required: true
        default: 'openwrt-21.02'
      device:
        description: '设备 profile'
        required: true
        default: 'honor_fur-602'
      extra_packages:
        description: '额外软件包（空格分隔的 OpenWrt 包名，留空=纯净版）'
        required: false
        default: ''
      theme:
        description: 'LuCI 主题包名（留空=用内置 bootstrap）'
        required: false
        default: 'luci-theme-design'
      theme_repo:
        description: '主题源码仓库（官方 feed 里没有 Design，需外挂）'
        required: false
        default: 'https://github.com/gngpp/luci-theme-design.git'
      enable_ccache:
        description: '启用 ccache 加速（重跑时显著变快）'
        type: boolean
        default: true

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  CONFIG_FILE: config/fur602-mt7981-5.4-mtwifi.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 取出本仓库（含 .config 种子）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git-core \
            libncurses-dev libssl-dev zlib1g-dev libelf-dev \
            python3 python3-dev python3-setuptools python3-pip \
            unzip zip rsync wget curl subversion \
            autoconf automake libtool autopoint pkg-config \
            ccache device-tree-compiler gperf help2man intltool \
            gcc-multilib g++-multilib libc6-dev-i386 \
            p7zip-full squashfs-tools xz-utils zstd \
            swig texinfo xmlto asciidoc uglifyjs
          # 22.04 上缺失的老包名，失败不影响
          sudo apt-get install -y libncurses5-dev python3-distutils 2>/dev/null || true
          python3 -V; gcc --version | head -1

      - name: 准备 ccache
        if: ${{ inputs.enable_ccache }}
        run: |
          sudo /usr/bin/ccache -M 5G
          /usr/bin/ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 恢复 ccache 缓存
        if: ${{ inputs.enable_ccache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.source_branch }}-${{ hashFiles('config/*.config') }}
          restore-keys: |
            ccache-${{ inputs.source_branch }}-

      - name: 拉取源码
        run: |
          git clone --depth=1 -b "${{ inputs.source_branch }}" "$REPO_URL" openwrt
          cd openwrt
          git log -1 --oneline
          echo "=========== feeds ==========="
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=========== 外挂主题 ==========="
          if [ -n "${{ inputs.theme }}" ] && [ -n "${{ inputs.theme_repo }}" ]; then
            rm -rf "package/${{ inputs.theme }}"
            git clone --depth=1 "${{ inputs.theme_repo }}" "package/${{ inputs.theme }}"
            ls "package/${{ inputs.theme }}"
          fi

      - name: 写入 .config 并展开默认值
        env:
          EXTRA_PKGS: ${{ inputs.extra_packages }}
          USE_CCACHE: ${{ inputs.enable_ccache }}
          THEME: ${{ inputs.theme }}
        run: |
          cd openwrt
          cp "../$CONFIG_FILE" .config
          if [ "$USE_CCACHE" = "true" ]; then
            echo "CONFIG_CCACHE=y" >> .config
          fi
          for p in $EXTRA_PKGS; do
            echo "CONFIG_PACKAGE_$p=y" >> .config
          done
          if [ -n "$THEME" ]; then
            echo "CONFIG_PACKAGE_$THEME=y" >> .config
          fi
          # 自定义文件（首启切换主题等）
          if [ -d ../files ]; then
            mkdir -p files
            cp -r ../files/. files/
          fi
          make defconfig
          ./scripts/diffconfig.sh > ../effective.config
          cat ../effective.config

      - name: 编译前校验（内核 / 设备 / mtwifi）
        run: |
          set -e
          cd openwrt
          echo "--- 内核版本 ---"
          grep -q 'KERNEL_PATCHVER:=5.4' target/linux/mediatek/Makefile
          echo "    OK: mediatek target 内核 = 5.4"
          echo "--- 目标 ---"
          grep -q '^CONFIG_TARGET_mediatek_mt7981=y' .config
          echo "    OK: TARGET = mediatek/mt7981"
          echo "--- 设备 ---"
          grep -q "^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_${{ inputs.device }}=y" .config \
            || { echo "    FAIL: 设备 ${{ inputs.device }} 未启用"; exit 1; }
          echo "    OK: DEVICE = ${{ inputs.device }}"
          grep -q "define Device/${{ inputs.device }}$" target/linux/mediatek/image/mt7981.mk
          echo "    OK: mt7981.mk 中存在该设备定义"
          echo "--- 无线 ---"
          grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config
          echo "    OK: 闭源 mtwifi (kmod-mt_wifi)"
          if grep -qE '^CONFIG_PACKAGE_kmod-mt7915e=y' .config; then
            echo "    FAIL: 同时启用了开源 mt7915e，与闭源 mtwifi 冲突"; exit 1
          fi
          echo "    OK: 未启用开源 mt76/mt7915e"
          echo "--- 主题 ---"
          if [ -n "${{ inputs.theme }}" ]; then
            grep -q "^CONFIG_PACKAGE_${{ inputs.theme }}=y" .config \
              || { echo "    FAIL: 主题 ${{ inputs.theme }} 未启用"; exit 1; }
            echo "    OK: 主题 = ${{ inputs.theme }}"
          fi
          echo "--- 分区大小 ---"
          grep -A9 "define Device/${{ inputs.device }}$" target/linux/mediatek/image/mt7981.mk | grep IMAGE_SIZE

      - name: 下载源码包（dl）
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true

      - name: 编译
        id: compile
        run: |
          cd openwrt
          echo "==> 开始编译 $(date '+%F %T')，$(nproc) 线程"
          make -j$(nproc) || {
            echo "==> 并行编译失败，改用单线程定位错误 $(date '+%F %T')"
            make -j1 V=s
          }
          echo "==> 编译完成 $(date '+%F %T')"

      - name: 校验并收集产物
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -e
          cd openwrt
          mkdir -p ../artifact
          BIN=bin/targets/mediatek/mt7981
          ls -lh "$BIN" || true
          for f in "$BIN"/*"$DEVICE"*; do
            if [ -f "$f" ]; then cp -v "$f" ../artifact/; fi
          done
          cp -v "$BIN"/sha256sums ../artifact/ 2>/dev/null || true
          cp -v "$BIN"/config.buildinfo ../artifact/ 2>/dev/null || true
          cp -v ../effective.config ../artifact/ 2>/dev/null || true
          echo "=== artifact ==="
          ls -lh ../artifact
          test -n "$(find ../artifact -name '*factory.bin')"     || { echo "FAIL: 缺少 factory.bin"; exit 1; }
          test -n "$(find ../artifact -name '*sysupgrade.bin')"  || { echo "FAIL: 缺少 sysupgrade.bin"; exit 1; }
          echo "OK: factory.bin / sysupgrade.bin 均存在"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fur602-immortalwrt-5.4-mtwifi-${{ github.run_number }}
          path: artifact
          retention-days: 30

      - name: 输出构建摘要
        run: |
          {
            echo "## HONOR FUR-602 · ImmortalWrt 5.4 + mtwifi 构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 源码 | \`${{ env.REPO_URL }}@${{ inputs.source_branch }}\` |"
            echo "| 目标 | \`mediatek/mt7981\` |"
            echo "| 内核 | 5.4 |"
            echo "| 无线 | MTK 闭源 \`kmod-mt_wifi\` |"
            echo "| 设备 | \`${{ inputs.device }}\` |"
            echo "| 主题 | \`${{ inputs.theme }}\` |"
            echo "| 额外包 | \`${{ inputs.extra_packages }}\` |"
            echo ""
            echo "### 产物"
            echo '```'
            ls -1 artifact
            echo '```'
            echo ""
            echo "> factory.bin 仅在 U-Boot 首次刷入；已切换 \`mtd_layout_label=expand(114m)\` 才可用。"
          } >> $GITHUB_STEP_SUMMARY
